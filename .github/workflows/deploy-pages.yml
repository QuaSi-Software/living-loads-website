name: Deploy website to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The build itself only reads the repository and the Pages configuration. The
    # permissions required for the deployment are granted to the deploy job only.
    permissions:
      contents: read
      pages: read
    # Superseded builds of the same pull request are pointless, but builds on the main
    # branch are kept as they feed the deployment.
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        # Third-party action, pinned to a commit SHA for supply chain safety. The version
        # comment is kept up to date by Dependabot, see .github/dependabot.yml
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      # base_path is empty for a custom domain and "/<repo-name>" for a project page, so
      # the same build works before and after the custom domain has been activated.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  # Pull requests are only built to validate that they do not break the website. They are
  # not deployed, which is why this job is skipped for them.
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Allow one concurrent deployment, but let a running one finish instead of cancelling
    # it, so a deployment is never left in a half-published state.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
